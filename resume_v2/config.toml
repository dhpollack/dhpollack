# The URL the site will be built for
base_url = "https://dhpollack.github.io/dhpollack/"

# Site-specific Vars
title = "David Pollack's Resume"
description = "Powered by Zola"
theme = "anpu"

# Build options
compile_sass = true
build_search_index = false
generate_feeds = false
output_dir = "public"
hard_link_static = false
preserve_dotfiles_in_output = false

# Content handling
ignored_content = []
ignored_static = []

taxonomies = [
    { name = "categories" },
    { name = "tags" },
]

# Markdown configuration
[markdown]
render_emoji = false
smart_punctuation = false
external_links_target_blank = false
external_links_no_follow = false
external_links_no_referrer = false
external_links_external = true

# Syntax highlighting configuration
[markdown.highlighting]
theme = "base16-ocean.dark"
light_theme = ""
dark_theme = ""
style = "inline"
error_on_missing_language = false

# Link checking configuration
[link_checker]
skip_prefixes = ["http://[2001:db8::]/"]
skip_anchor_prefixes = ["https://caniuse.com/"]
internal_level = "error"
external_level = "error"

# Slugify configuration
[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"
paths_keep_dates = false

# Search configuration (if build_search_index = true)
[search]
include_title = true
include_description = false
include_date = false
include_path = false
include_content = true
index_format = "elasticlunr_javascript"

[extra]
# Anpu theme variables
anpu_menu_links = []
anpu_date_format = "%e %B %Y"
